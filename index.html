<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LLM Switcher</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-container">
    <!-- Header with Search -->
    <header class="app-header">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search service or profile..." autocomplete="off">
      </div>
    </header>

    <!-- Cards Scroll Area -->
    <main class="cards-container" id="cards-list">
      <!-- Dynamic cards will be rendered here -->
      <div class="loading">Loading services...</div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <button id="settings-btn" class="footer-btn">
        Configure Switcher
      </button>
    </footer>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
